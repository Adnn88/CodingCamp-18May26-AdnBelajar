<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingCamp Life Dashboard - All Challenges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="btn-theme">Toggle Theme</button>

    <div class="dashboard-container">
        
        <header class="card greeting-card">
            <h1 id="clock">00:00:00</h1>
            <p id="date">Loading date...</p>
            <h2 id="greeting-text">Good Morning, <span id="username" contenteditable="true" title="Click to edit name">Guest</span></h2>
        </header>

        <section class="card timer-card">
            <h3>Focus Timer</h3>
            
            <div class="timer-settings">
                <label for="timer-duration">Set Duration (mins):</label>
                <input type="number" id="timer-duration" value="25" min="1" max="60">
            </div>

            <div id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="timer-start" class="btn btn-start">Start</button>
                <button id="timer-stop" class="btn btn-stop">Stop</button>
                <button id="timer-reset" class="btn btn-reset">Reset</button>
            </div>
        </section>

        <section class="card todo-card">
            <div class="todo-header">
                <h3>Tasks</h3>
                <select id="todo-sort">
                    <option value="default">Order Added</option>
                    <option value="alpha">A-Z Alphabetical</option>
                    <option value="status">Incomplete First</option>
                </select>
            </div>
            
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="Add a new task..." required>
                <button type="submit" class="btn btn-add">Add</button>
            </form>
            <ul id="todo-list"></ul>
        </section>

        <section class="card links-card">
            <h3>Quick Links</h3>
            <form id="link-form">
                <input type="text" id="link-name" placeholder="Link name" required>
                <input type="url" id="link-url" placeholder="URL (https://...)" required>
                <button type="submit" class="btn btn-add-link">Add Link</button>
            </form>
            <div id="links-container"></div>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
